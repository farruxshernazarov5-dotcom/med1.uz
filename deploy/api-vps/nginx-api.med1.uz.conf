server {
    listen 80;
    listen [::]:80;
    server_name api.med1.uz;

    add_header X-Med1-Api-Config "2026-09-05-v2" always;
    client_max_body_size 10m;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"med1-api-gateway-proxy","ip":"89.39.95.5","config":"2026-09-05-v2"}';
    }

    # Hujjatlar
    location = / {
        return 302 https://med1.uz/api-docs;
    }
    location = /docs {
        return 302 https://med1.uz/api-docs;
    }
    location = /partner-docs {
        return 302 https://med1.uz/developers;
    }

    # --- Barcha API so'rovlari: https://api.med1.uz/v1/... ---
    location /v1/ {
        limit_except GET POST PUT PATCH DELETE OPTIONS { deny all; }
        rewrite ^ /functions/v1/api-gateway$request_uri break;
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    # OpenAPI spetsifikatsiyasi
    location = /openapi.json {
        return 302 https://med1.uz/openapi.json;
    }

    # --- AI xizmatlari uchun to'g'ridan-to'g'ri yo'l ---
    location = /ai {
        limit_except POST GET OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/ai-external-api;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    location / {
        return 404;
    }
}
