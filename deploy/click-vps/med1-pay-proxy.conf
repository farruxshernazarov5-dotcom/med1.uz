# MED1.UZ umumiy proxy sarlavhalari (barcha to'lov yo'llari uchun).
# O'rnatish joyi: /etc/nginx/snippets/med1-pay-proxy.conf
proxy_ssl_server_name on;
proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
proxy_set_header Authorization $http_authorization;
proxy_pass_header Authorization;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_pass_request_body on;
proxy_request_buffering off;
proxy_buffering off;
proxy_connect_timeout 10s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
proxy_intercept_errors off;
add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
