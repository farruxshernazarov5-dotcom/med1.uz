server {
    listen 80;
    listen [::]:80;
    server_name pay.med1.uz;

    # Deployment marker: health checks use this to detect an outdated VPS config.
    add_header X-Med1-Proxy-Config "2026-09-02-v4" always;
    client_max_body_size 1m;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"med1-payment-tasix-proxy","ip":"89.39.95.5","config":"2026-09-02-v4"}';
    }

    # pay.med1.uz is a callback gateway, not a website.
    location = / {
        return 302 https://med1.uz/payment/success;
    }

    # --- CLICK (yangi + eski aliaslar) ---
    location ~ ^/(click/prepare|click-prepare)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-prepare;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    location ~ ^/(click/complete|click-complete)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-complete;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    location = /click/webhook {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-webhook;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    # --- PAYME (Paycom) Merchant API, JSON-RPC 2.0 ---
    location ~ ^/(payme|payme/|api/payme)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/payme-webhook;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    # --- UZUM BANK ---
    location ~ ^/(uzum|uzum/|api/uzum)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/uzum-webhook;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    # --- Umumiy to'lov webhooki (boshqa provayderlar) ---
    location ~ ^/(payment/webhook|api/payment)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/payment-webhook;
        include /etc/nginx/snippets/med1-pay-proxy.conf;
    }

    location / {
        return 404;
    }
}
