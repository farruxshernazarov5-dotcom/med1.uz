server {
    listen 80;
    listen [::]:80;
    server_name pay.med1.uz;

    # Deployment marker: health checks use this to detect an outdated VPS config.
    add_header X-Med1-Proxy-Config "2026-09-01-v2" always;

    location = /health {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"ok":true,"service":"med1-payment-tasix-proxy","ip":"89.39.95.5","config":"2026-09-01-v2"}';
    }

    # Human-friendly root: pay.med1.uz is a callback gateway, not a website.
    # Redirect accidental browser visits instead of showing nginx 404.
    location = / {
        return 302 https://med1.uz/payment/success;
    }

    location = /click/prepare {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-prepare;
        proxy_ssl_server_name on;
        proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
    }

    location = /click/complete {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-complete;
        proxy_ssl_server_name on;
        proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
    }


    # Backward-compatible aliases. These keep callbacks working if CLICK's
    # cabinet still has the previously supplied endpoint names.
    location = /click-prepare {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-prepare;
        proxy_ssl_server_name on;
        proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
    }

    location = /click-complete {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/click-complete;
        proxy_ssl_server_name on;
        proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
    }

    # --- Payme (Paycom) Merchant API endpoint ---
    # JSON-RPC 2.0, POST only. Basic Auth sarlavhasi o'zgarmasdan uzatiladi.
    location ~ ^/(payme|payme/|api/payme)$ {
        limit_except GET POST OPTIONS { deny all; }
        proxy_pass https://wiqcfyecdmararxqdmfk.supabase.co/functions/v1/payme-webhook;
        proxy_ssl_server_name on;
        proxy_ssl_name wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Host wiqcfyecdmararxqdmfk.supabase.co;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_pass_request_body on;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_intercept_errors off;
        add_header X-Med1-Tasix-Proxy "89.39.95.5" always;
    }

    location / {
        return 404;
    }
}
